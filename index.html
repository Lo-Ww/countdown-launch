<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Countdown - Lancement Produit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --accent: #FD79A8;
            --dark: #2D3436;
            --light: #DFE6E9;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #2d2b55 100%);
            color: white;
            overflow: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .logo-placeholder:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .subtitle {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .date-label {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: clamp(0.5rem, 3vw, 2rem);
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .time-block {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: clamp(1rem, 3vw, 2rem) clamp(1.2rem, 3vw, 2.5rem);
            min-width: clamp(80px, 15vw, 140px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .time-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
            opacity: 0.5;
        }

        .time-block:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--secondary);
            box-shadow: 0 10px 40px rgba(108, 92, 231, 0.2);
        }

        .time-value {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.3rem;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .time-label {
            font-size: clamp(0.6rem, 1.5vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
        }

        .time-value.flip {
            animation: flipDown 0.6s ease;
        }

        @keyframes flipDown {
            0% { transform: scaleY(0.8); opacity: 0.5; }
            50% { transform: scaleY(1.05); }
            100% { transform: scaleY(1); opacity: 1; }
        }

        .progress-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 2rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            transition: width 1s ease;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -2px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .progress-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 0.5rem;
            text-align: right;
        }

        .motivation {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            font-style: italic;
        }

        .launch-message {
            display: none;
            text-align: center;
            z-index: 10;
            animation: zoomIn 1s ease;
        }

        .launch-message.active {
            display: block;
        }

        .launch-message h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FD79A8, #FDCB6E, #6C5CE7, #00CEC9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s ease infinite;
            background-size: 400% 400%;
        }

        .launch-message p {
            font-size: 1.5rem;
            margin-top: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes zoomIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes rainbow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(0) rotateZ(0deg) rotateX(0deg); opacity: 1; }
            75% { opacity: 1; }
            100% { transform: translateY(100vh) rotateZ(720deg) rotateX(360deg); opacity: 0; }
        }

        .pulse-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 1px solid rgba(108, 92, 231, 0.1);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
        }

        .pulse-ring:nth-child(2) { animation-delay: 1s; width: 500px; height: 500px; }
        .pulse-ring:nth-child(3) { animation-delay: 2s; width: 700px; height: 700px; }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.1; }
        }

        /* Debug banner */
        .debug-banner {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            border-radius: 8px;
            z-index: 9999;
            font-family: monospace;
        }

        @media (max-width: 480px) {
            .countdown { gap: 0.5rem; }
            .time-block { min-width: 70px; padding: 0.8rem; border-radius: 14px; }
        }
    </style>
</head>
<body>

    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>

    <div class="particles" id="particles"></div>
    <div class="confetti-container" id="confetti-container"></div>

    <!-- Debug : affiche les dates pour vérifier -->
    <div class="debug-banner" id="debug"></div>

    <div class="container" id="countdown-container">
        <div class="logo-container">
            <div class="logo-placeholder">🚀</div>
        </div>

        <h2 class="title">Lancement dans</h2>
        <h1 class="subtitle" id="main-title">Bientôt en ligne</h1>
        <p class="date-label">📅 1er Mars 2025 — 00h00</p>

        <div class="countdown" id="countdown">
            <div class="time-block">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Jours</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Heures</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Secondes</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <p class="progress-text" id="progress-text">0% accompli</p>
        </div>

        <p class="motivation" id="motivation">💪 Chaque jour nous rapproche du lancement !</p>
    </div>

    <div class="launch-message" id="launch-message">
        <h1>🎉 C'EST PARTI ! 🎉</h1>
        <p>Le produit est officiellement lancé !</p>
    </div>

    <script>
        // ══════════════════════════════════════
        //  DATES — Mars = mois 2 en JavaScript (0=Jan, 1=Fev, 2=Mars)
        // ══════════════════════════════════════
        var launchYear = 2025;
        var launchMonth = 2; // 2 = MARS
        var launchDay = 1;

        var startYear = 2025;
        var startMonth = 0; // 0 = JANVIER
        var startDay = 1;

        var LAUNCH_DATE = new Date(launchYear, launchMonth, launchDay, 0, 0, 0, 0);
        var START_DATE = new Date(startYear, startMonth, startDay, 0, 0, 0, 0);

        // ══════════════════════════════════════
        //  DEBUG — affiche les infos (à retirer plus tard)
        // ══════════════════════════════════════
        var now = new Date();
        var debugEl = document.getElementById('debug');
        debugEl.innerHTML =
            'NOW: ' + now.toString() + '<br>' +
            'LAUNCH: ' + LAUNCH_DATE.toString() + '<br>' +
            'DIFF (ms): ' + (LAUNCH_DATE - now) + '<br>' +
            'DIFF (jours): ' + Math.floor((LAUNCH_DATE - now) / (1000*60*60*24));

        // ══════════════════════════════════════
        //  MESSAGES MOTIVATION
        // ══════════════════════════════════════
        var MOTIVATIONS = [
            { maxDays: 1, msg: "🔥 C'est DEMAIN ! On y est presque !" },
            { maxDays: 3, msg: "⚡ Plus que quelques jours... La tension monte !" },
            { maxDays: 7, msg: "🎯 Dernière ligne droite, on lâche rien !" },
            { maxDays: 14, msg: "🚀 Deux semaines ! Le compte à rebours s'accélère !" },
            { maxDays: 30, msg: "💪 Un mois... Chaque jour compte !" },
            { maxDays: 60, msg: "🌟 On avance bien, le lancement approche !" },
            { maxDays: 99999, msg: "💪 Chaque jour nous rapproche du lancement !" }
        ];

        // ══════════════════════════════════════
        //  PARTICULES
        // ══════════════════════════════════════
        function createParticles() {
            var container = document.getElementById('particles');
            for (var i = 0; i < 50; i++) {
                var particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                var size = (Math.random() * 4 + 1) + 'px';
                particle.style.width = size;
                particle.style.height = size;
                container.appendChild(particle);
            }
        }

        // ══════════════════════════════════════
        //  CONFETTIS
        // ══════════════════════════════════════
        function launchConfetti() {
            var container = document.getElementById('confetti-container');
            var colors = ['#FD79A8', '#FDCB6E', '#6C5CE7', '#00CEC9', '#FF6B6B', '#A29BFE', '#55EFC4'];

            for (var i = 0; i < 150; i++) {
                (function(index) {
                    setTimeout(function() {
                        var confetti = document.createElement('div');
                        confetti.className = 'confetti-piece';
                        var color = colors[Math.floor(Math.random() * colors.length)];
                        confetti.style.left = Math.random() * 100 + '%';
                        confetti.style.background = color;
                        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                        confetti.style.width = (Math.random() * 10 + 5) + 'px';
                        confetti.style.height = (Math.random() * 10 + 5) + 'px';
                        confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                        container.appendChild(confetti);
                        setTimeout(function() { confetti.remove(); }, 5000);
                    }, index * 30);
                })(i);
            }
            setTimeout(launchConfetti, 6000);
        }

        // ══════════════════════════════════════
        //  COUNTDOWN
        // ══════════════════════════════════════
        var previousValues = { days: '', hours: '', minutes: '', seconds: '' };

        function updateCountdown() {
            var now = new Date();
            var diff = LAUNCH_DATE.getTime() - now.getTime();

            if (diff <= 0) {
                document.getElementById('countdown-container').style.display = 'none';
                document.getElementById('launch-message').className = 'launch-message active';
                document.getElementById('debug').style.display = 'none';
                launchConfetti();
                document.title = "🎉 C'EST PARTI !";
                return;
            }

            var totalSeconds = Math.floor(diff / 1000);
            var days = Math.floor(totalSeconds / 86400);
            var hours = Math.floor((totalSeconds % 86400) / 3600);
            var minutes = Math.floor((totalSeconds % 3600) / 60);
            var seconds = totalSeconds % 60;

            var values = {
                days: (days < 10 ? '0' : '') + days,
                hours: (hours < 10 ? '0' : '') + hours,
                minutes: (minutes < 10 ? '0' : '') + minutes,
                seconds: (seconds < 10 ? '0' : '') + seconds
            };

            var units = ['days', 'hours', 'minutes', 'seconds'];
            for (var i = 0; i < units.length; i++) {
                var unit = units[i];
                var el = document.getElementById(unit);
                if (previousValues[unit] !== values[unit]) {
                    el.textContent = values[unit];
                    el.className = 'time-value';
                    void el.offsetWidth;
                    el.className = 'time-value flip';
                }
            }

            previousValues = {
                days: values.days,
                hours: values.hours,
                minutes: values.minutes,
                seconds: values.seconds
            };

            document.title = '🚀 J-' + days + ' — Lancement Produit';

            // Barre de progression
            var totalDuration = LAUNCH_DATE.getTime() - START_DATE.getTime();
            var elapsed = now.getTime() - START_DATE.getTime();
            var progress = Math.min(Math.max((elapsed / totalDuration) * 100, 0), 100);
            document.getElementById('progress-fill').style.width = progress.toFixed(1) + '%';
            document.getElementById('progress-text').textContent = progress.toFixed(1) + '% accompli';

            // Message motivation
            for (var j = 0; j < MOTIVATIONS.length; j++) {
                if (days <= MOTIVATIONS[j].maxDays) {
                    document.getElementById('motivation').innerHTML = MOTIVATIONS[j].msg;
                    break;
                }
            }

            setTimeout(updateCountdown, 1000);
        }

        // ══════════════════════════════════════
        //  LANCEMENT
        // ══════════════════════════════════════
        createParticles();
        updateCountdown();
    </script>
</body>
</html>
