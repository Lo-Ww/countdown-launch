<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Countdown - Lancement Produit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --accent: #FD79A8;
            --dark: #2D3436;
            --light: #DFE6E9;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #2d2b55 100%);
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* ── Particules de fond ── */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* ── Conteneur principal ── */
        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        /* ── Logo entreprise ── */
        .logo-container {
            margin-bottom: 2rem;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .logo-placeholder:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* ── Titre ── */
        .title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        .subtitle {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .date-label {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* ── Compteur ── */
        .countdown {
            display: flex;
            justify-content: center;
            gap: clamp(0.5rem, 3vw, 2rem);
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .time-block {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: clamp(1rem, 3vw, 2rem) clamp(1.2rem, 3vw, 2.5rem);
            min-width: clamp(80px, 15vw, 140px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .time-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
            opacity: 0.5;
        }

        .time-block:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--secondary);
            box-shadow: 0 10px 40px rgba(108, 92, 231, 0.2);
        }

        .time-value {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.3rem;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .time-label {
            font-size: clamp(0.6rem, 1.5vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
        }

        /* ── Animation flip ── */
        .time-value.flip {
            animation: flipDown 0.6s ease;
        }

        @keyframes flipDown {
            0% { transform: scaleY(0.8); opacity: 0.5; }
            50% { transform: scaleY(1.05); }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* ── Barre de progression ── */
        .progress-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 2rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            transition: width 1s ease;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -2px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .progress-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 0.5rem;
            text-align: right;
        }

        /* ── Message motivation ── */
        .motivation {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            font-style: italic;
        }

        .motivation .emoji {
            font-style: normal;
        }

        /* ── JOUR J ── */
        .launch-message {
            display: none;
            animation: zoomIn 1s ease;
        }

        .launch-message.active {
            display: block;
        }

        .launch-message h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FD79A8, #FDCB6E, #6C5CE7, #00CEC9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s ease infinite;
            background-size: 400% 400%;
        }

        .launch-message p {
            font-size: 1.5rem;
            margin-top: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes zoomIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes rainbow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ── Confettis ── */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotateZ(0deg) rotateX(0deg);
                opacity: 1;
            }
            75% { opacity: 1; }
            100% {
                transform: translateY(100vh) rotateZ(720deg) rotateX(360deg);
                opacity: 0;
            }
        }

        /* ── Pulse ring ── */
        .pulse-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 1px solid rgba(108, 92, 231, 0.1);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
            z-index: 0;
        }

        .pulse-ring:nth-child(2) { animation-delay: 1s; width: 500px; height: 500px; }
        .pulse-ring:nth-child(3) { animation-delay: 2s; width: 700px; height: 700px; }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.1; }
        }

        /* ── Responsive ajustements ── */
        @media (max-width: 480px) {
            .countdown {
                gap: 0.5rem;
            }
            .time-block {
                min-width: 70px;
                padding: 0.8rem;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Anneaux de pulse en arrière-plan -->
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>

    <!-- Particules flottantes -->
    <div class="particles" id="particles"></div>

    <!-- Conteneur de confettis -->
    <div class="confetti-container" id="confetti-container"></div>

    <!-- Contenu principal -->
    <div class="container" id="countdown-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-placeholder">🚀</div>
            <!-- Remplacez par : <img src="votre-logo.png" alt="Logo" style="width:80px;"> -->
        </div>

        <!-- Titre -->
        <h2 class="title">Lancement dans</h2>
        <h1 class="subtitle" id="main-title">Bientôt en ligne</h1>
        <p class="date-label">📅 1er Mars 2025 — 00h00</p>

        <!-- Compteur -->
        <div class="countdown" id="countdown">
            <div class="time-block">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Jours</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Heures</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-block">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Secondes</div>
            </div>
        </div>

        <!-- Barre de progression -->
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <p class="progress-text" id="progress-text">0% accompli</p>
        </div>

        <!-- Message motivation -->
        <p class="motivation" id="motivation">
            <span class="emoji">💪</span> Chaque jour nous rapproche du lancement !
        </p>
    </div>

    <!-- Message Jour J -->
    <div class="launch-message" id="launch-message">
        <h1>🎉 C'EST PARTI ! 🎉</h1>
        <p>Le produit est officiellement lancé !</p>
    </div>

    <script>
        // ══════════════════════════════════════
        //  CONFIGURATION
        // ══════════════════════════════════════
        const LAUNCH_DATE = new Date(2025, 2, 1, 0, 0, 0);
        // Date de début du countdown (pour la barre de progression)
        const START_DATE = new Date(2025, 0, 1, 0, 0, 0);

        // Messages de motivation selon les jours restants
        const MOTIVATIONS = [
            { maxDays: 1, msg: "🔥 C'est DEMAIN ! On y est presque !" },
            { maxDays: 3, msg: "⚡ Plus que quelques jours... La tension monte !" },
            { maxDays: 7, msg: "🎯 Dernière ligne droite, on lâche rien !" },
            { maxDays: 14, msg: "🚀 Deux semaines ! Le compte à rebours s'accélère !" },
            { maxDays: 30, msg: "💪 Un mois... Chaque jour compte !" },
            { maxDays: 60, msg: "🌟 On avance bien, le lancement approche !" },
            { maxDays: Infinity, msg: "💪 Chaque jour nous rapproche du lancement !" }
        ];

        // ══════════════════════════════════════
        //  PARTICULES DE FOND
        // ══════════════════════════════════════
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                particle.style.width = (Math.random() * 4 + 1) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // ══════════════════════════════════════
        //  CONFETTIS 🎊
        // ══════════════════════════════════════
        function launchConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#FD79A8', '#FDCB6E', '#6C5CE7', '#00CEC9', '#FF6B6B', '#A29BFE', '#55EFC4'];
            const shapes = ['square', 'circle'];

            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti-piece');
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const shape = shapes[Math.floor(Math.random() * shapes.length)];

                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = color;
                    confetti.style.borderRadius = shape === 'circle' ? '50%' : '2px';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';

                    container.appendChild(confetti);

                    // Nettoyage
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }

            // Relancer toutes les 5 secondes le jour J
            setTimeout(launchConfetti, 6000);
        }

        // ══════════════════════════════════════
        //  COUNTDOWN
        // ══════════════════════════════════════
        let previousValues = { days: '', hours: '', minutes: '', seconds: '' };

        function updateCountdown() {
            const now = new Date();
            const diff = LAUNCH_DATE - now;

            if (diff <= 0) {
                // 🎉 JOUR J !
                document.getElementById('countdown-container').style.display = 'none';
                const launchMsg = document.getElementById('launch-message');
                launchMsg.classList.add('active');
                launchConfetti();
                document.title = '🎉 C\'EST PARTI !';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const values = {
                days: String(days).padStart(2, '0'),
                hours: String(hours).padStart(2, '0'),
                minutes: String(minutes).padStart(2, '0'),
                seconds: String(seconds).padStart(2, '0')
            };

            // Mise à jour avec animation flip
            ['days', 'hours', 'minutes', 'seconds'].forEach(unit => {
                const el = document.getElementById(unit);
                if (previousValues[unit] !== values[unit]) {
                    el.textContent = values[unit];
                    el.classList.remove('flip');
                    void el.offsetWidth; // Force reflow
                    el.classList.add('flip');
                }
            });

            previousValues = { ...values };

            // Mise à jour du titre de la page
            document.title = `🚀 J-${days} — Lancement Produit`;

            // Barre de progression
            const totalDuration = LAUNCH_DATE - START_DATE;
            const elapsed = now - START_DATE;
            const progress = Math.min(Math.max((elapsed / totalDuration) * 100, 0), 100);
            document.getElementById('progress-fill').style.width = progress.toFixed(1) + '%';
            document.getElementById('progress-text').textContent = progress.toFixed(1) + '% accompli';

            // Message motivation
            const motivation = MOTIVATIONS.find(m => days <= m.maxDays);
            document.getElementById('motivation').innerHTML = motivation.msg;

            // Prochaine mise à jour
            requestAnimationFrame(() => setTimeout(updateCountdown, 1000));
        }

        // ══════════════════════════════════════
        //  INITIALISATION
        // ══════════════════════════════════════
        createParticles();
        updateCountdown();
    </script>
</body>
</html>
